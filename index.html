document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"2375b4ae-27aa-4482-980c-c2f75da359cb\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: \"Segoe UI\", system-ui, -apple-system, Arial, sans-serif; -webkit-font-smoothing: antialiased; background:#E6E6E6; }\n  ::-webkit-scrollbar { width: 12px; height: 12px; }\n  ::-webkit-scrollbar-thumb { background: #C8C6C4; border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }\n  ::-webkit-scrollbar-thumb:hover { background: #A19F9D; background-clip: content-box; }\n  .docbody p { font-size: 15px; line-height: 1.6; color: #242424; margin-bottom: 11px; }\n  .docbody h2 { font-family: Georgia, serif; }\n  .wtable { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 16px; }\n  .wtable th { background:#2B5797; color:#fff; font-weight:600; text-align:left; padding:8px 10px; border:1px solid #244B82; font-size:12.5px; }\n  .wtable td { padding:7px 10px; border:1px solid #D4D4D4; color:#242424; vertical-align:top; }\n  .wtable tr:nth-child(even) td { background:#F4F6FB; }\n  @media print { body { background:#fff; } .nopane { display:none !important; } .docpage { box-shadow:none !important; margin:0 !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;\">\n\n  <!-- ===== WORD TITLE BAR ===== -->\n  <div class=\"nopane\" style=\"height:48px;background:#2B5797;display:flex;align-items:center;padding:0 14px;gap:12px;color:#fff;flex-shrink:0;position:sticky;top:0;z-index:60;\">\n    <div style=\"width:26px;height:26px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#2B5797;font-size:16px;font-weight:800;font-family:Georgia,serif;\">W<\u002Fdiv>\n    <span style=\"font-size:13.5px;font-weight:600;\">Ne x;padding:0 10px;font-size:12.5px;outline:none;color:#242424;\">\n      <\u002Fdiv>\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8A8886;padding:4px 10px 6px;\">Headings<\u002Fdiv>\n      <sc-for list=\"{{ navItems }}\" as=\"nav\" hint-placeholder-count=\"14\">\n        <div onclick=\"{{ nav.go }}\" style=\"display:flex;gap:9px;align-items:flex-start;padding:7px 10px;margin-bottom:1px;border-radius:5px;cursor:pointer;background:{{ nav.bg }};border-left:3px solid {{ nav.bar }};\" style-hover=\"background:#EFF3FB;\">\n          <span style=\"font-size:11px;font-weight:700;color:{{ nav.numColor }};width:26px;flex-shrink:0;text-align:right;\">{{ nav.num }}<\u002Fspan>\n          <span style=\"font-size:12.5px;color:{{ nav.textColor }};font-weight:{{ nav.weight }};line-height:1.3;\">{{ nav.title }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"margin:14px 6px 6px;padding:12px;background:#EAF1FB;border-radius:6px;font-size:11.5px;color:#2B5797;line-height:1.5;\">\n        <strong>Tip<\u002Fstrong> — every section ends with a <em>Where to find it<\u002Fem> box showing the software, exact location, owner and method.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DOCUMENT PAGE -->\n    <div style=\"flex:1;display:flex;justify-content:center;padding:28px 28px 80px;min-width:0;\">\n      <div class=\"docpage docbody\" style=\"width:850px;max-width:100%;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.16);padding:72px 84px;\">\n        <!-- ===== COVER ===== -->\n        <div id=\"sec-cover\" style=\"scroll-margin-top:96px;\">\n          <div style=\"border-top:6px solid #2B5797;padding-top:30px;\">\n            <div style=\"font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#2B5797;font-weight:700;\">Brightpath Logistics · Revenue Operations<\u002Fdiv>\n            <h1 style=\"font-family:Georgia,serif;font-size:42px;line-height:1.12;color:#1B1B1B;margin:18px 0 10px;font-weight:700;\">NexGen CRM Rollout<\u002Fh1>\n            <div style=\"font-size:20px;color:#444;font-family:Georgia,serif;font-style:italic;\">Project Playbook &amp; Document Pack — Phase 1<\u002Fdiv>\n            <p style=\"margin-top:22px;max-width:560px;color:#444;\">A single working document for the NexGen CRM implementation. Every project artifact — charter, plan, risks, budget, resources, RACI and more — lives here, and each tells you <strong>where it lives in our software<\u002Fstrong>, <strong>who owns it<\u002Fstrong>, and <strong>how it is kept current<\u002Fstrong>.<\u002Fp>\n          <\u002Fdiv>\n          <table class=\"wtable\" style=\"margin-top:30px;\">\n            <tbody>\n              <tr><td style=\"width:200px;font-weight:600;background:#F4F6FB;\">Project<\u002Ftd><td>NexGen CRM Rollout — Phase 1<\u002Ftd><\u002Ftr>\n              <tr><td style=\"font-weight:600;background:#F4F6FB;\">Document owner<\u002Ftd><td>Jewel — Project Manager<\u002Ftd><\u002Ftr>\n              <tr><td style=\"font-weight:600;background:#F4F6FB;\">Sponsor<\u002Ftd><td>Daniel — VP Revenue Operations<\u002Ftd><\u002Ftr>\n              <tr><td style=\"font-weight:600;background:#F4F6FB;\">Version<\u002Ftd><td>v3.2 · updated 24 Jun 2026<\u002Ftd><\u002Ftr>\n              <tr><td style=\"font-weight:600;background:#F4F6FB;\">Status<\u002Ftd><td><span style=\"color:#107C10;font-weight:600;\">● On Track<\u002Fspan> — Hypercare (week 4 of 6)<\u002Ftd><\u002Ftr>\n              <tr><td style=\"font-weight:600;background:#F4F6FB;\">Distribution<\u002Ftd><td>Steering committee, PMO, workstream leads<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <!-- ===== HOW TO USE ===== -->\n        <div id=\"sec-toc\" style=\"scroll-margin-top:96px;margin-top:54px;border-top:1px solid #E1DFDD;padding-top:30px;\">\n          <h2 style=\"font-size:25px;color:#1B1B1B;margin-bottom:6px;\">How to use this playbook<\u002Fh2>\n          <p style=\"color:#605E5C;font-size:13.5px;border-bottom:2px solid #2B5797;display:inline-block;padding-bottom:4px;\">Contents<\u002Fp>\n          <p>Use the <strong>Navigation pane<\u002Fstrong> on the left to jump to any of the thirteen documents. Each section follows the same shape: a short narrative, the live data table, and a blue <em>Where to find it<\u002Fem> box. That box is the important part — it points you to the exact tool and location, names the responsible owner, and explains the method used to keep the item up to date.<\u002Fp>\n          <p style=\"background:#FFF8E8;border-left:4px solid #C19C00;border-radius:0 6px 6px 0;padding:11px 16px;font-size:13.5px;\"><strong>Hover for the story behind the numbers.<\u002Fstrong> Hover any <span style=\"border-bottom:1px dashed #2B5797;cursor:help;\">figure<\u002Fspan> to see its trend and how it was derived, any <span style=\"border-bottom:1px dashed #2B5797;cursor:help;\">status<\u002Fspan> to see the tool behind it and the recommended next step, and any <span style=\"border-bottom:1px dashed #2B5797;cursor:help;color:#2B5797;font-weight:600;\">owner name<\u002Fspan> to get their role, email and phone.<\u002Fp>\n          <table class=\"wtable\">\n            <thead><tr><th style=\"width:46px;\">#<\u002Fth><th>Document<\u002Fth><th>Lives in<\u002Fth><th>Owner<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td>1<\u002Ftd><td>Project Charter<\u002Ftd><td>SharePoint<\u002Ftd><td>Daniel / Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>2<\u002Ftd><td>Project Plan &amp; Schedule<\u002Ftd><td>Excel (Project Online)<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>3<\u002Ftd><td>Gantt / Timeline<\u002Ftd><td>NexGen CRM · Projects<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>4<\u002Ftd><td>Status Report<\u002Ftd><td>PowerPoint / Teams<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>5<\u002Ftd><td>Risk Register<\u002Ftd><td>Excel · Risks tab<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>6<\u002Ftd><td>Issue Tracker<\u002Ftd><td>Teams · Planner<\u002Ftd><td>Priya<\u002Ftd><\u002Ftr>\n              <tr><td>7<\u002Ftd><td>Budget Tracker<\u002Ftd><td>Excel · Budget tab<\u002Ftd><td>Daniel<\u002Ftd><\u002Ftr>\n              <tr><td>8<\u002Ftd><td>Resource Plan<\u002Ftd><td>Excel · Resourcing<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>9<\u002Ftd><td>Communication Plan<\u002Ftd><td>SharePoint / Slack<\u002Ftd><td>Lena<\u002Ftd><\u002Ftr>\n              <tr><td>10<\u002Ftd><td>Change Log<\u002Ftd><td>SharePoint list<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>11<\u002Ftd><td>Work Breakdown Structure<\u002Ftd><td>PowerPoint<\u002Ftd><td>Priya<\u002Ftd><\u002Ftr>\n              <tr><td>12<\u002Ftd><td>RACI &amp; Task Tracker<\u002Ftd><td>Excel / Teams Planner<\u002Ftd><td>Jewel<\u002Ftd><\u002Ftr>\n              <tr><td>13<\u002Ftd><td>Team Incentives &amp; Logistics<\u002Ftd><td>Concur / Excel<\u002Ftd><td>Lena / Jewel<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <!-- ===== 1. CHARTER ===== -->\n        <div id=\"sec-s1\" style=\"scroll-margin-top:96px;margin-top:54px;border-top:1px solid #E1DFDD;padding-top:30px;\">\n          <div style=\"font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#2B5797;font-weight:700;\">Document 1<\u002Fdiv>\n          <h2 style=\"font-size:25px;color:#1B1B1B;margin:4px 0 14px;\">Project Charter<\u002Fh2>\n          <p><strong>Purpose.<\u002Fstrong> Replace the legacy CRM and disconnected spreadsheets with NexGen across Sales, Customer Success and Support — one source of truth for 240 users and ~142,000 accounts, live by 18 May 2026.<\u002Fp>\n          <p><strong>Objectives &amp; success measures.<\u002Fstrong><\u002Fp>\n          <table class=\"wtable\">\n            <thead><tr><th>Objective<\u002Fth><th style=\"width:160px;\">Measure<\u002Fth><th style=\"width:120px;\">Target<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td>Single CRM adopted across all three functions<\u002Ftd><td>30-day active users<\u002Ftd><td>≥ 80%<\u002Ftd><\u002Ftr>\n              <tr><td>Clean, de-duplicated account data<\u002Ftd><td>Migration accuracy<\u002Ftd><td>≥ 99%<\u002Ftd><\u002Ftr>\n              <tr><td>Faster quote-to-close<\u002Ftd><td>Avg. sales cycle<\u002Ftd><td>−15%<\u002Ftd><\u002Ftr>\n              <tr><td>Deliver on time and budget<\u002Ftd><td>Schedule / cost<\u002Ftd><td>±5%<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n          <p><strong>Scope.<\u002Fstrong> In: data migration, ERP + email + telephony integration, role-based training, hypercare. Out (Phase 2): marketing automation, partner portal, advanced AI scoring.<\u002Fp>\n          <div style=\"background:#EAF1FB;border-left:4px solid #2B5797;border-radius:0 6px 6px 0;padding:14px 18px;margin:18px 0 4px;\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#2B5797;margin-bottom:8px;\">Where to find it<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;color:#242424;\">\n              <span style=\"color:#605E5C;\">Software<\u002Fspan><span><strong>SharePoint<\u002Fstrong> → <em>NexGen CRM Rollout<\u002Fem> site → Documents → <em>01_Charter<\u002Fem><\u002Fspan>\n              <span style=\"color:#605E5C;\">Approval<\u002Fspan><span>Signed e-approval logged in the SharePoint <em>Approvals<\u002Fem> column (Daniel, 09 Jan 2026)<\u002Fspan>\n              <span style=\"color:#605E5C;\">Owner<\u002Fspan><span><span data-tip=\"own_daniel\" style=\"cursor:help;border-bottom:1px dotted #2B5797;color:#2B5797;font-weight:600;\">Daniel<\u002Fspan> (accountable) · <span data-tip=\"own_jewel\" style=\"cursor:help;border-bottom:1px dotted #2B5797;color:#2B5797;font-weight:600;\">Jewel<\u002Fspan> (maintains)<\u002Fspan>\n              <span style=\"color:#605E5C;\">How / cadence<\u002Fspan><span>Baselined — changes only via the Change Log (§10) and re-approval<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== 2. PROJECT PLAN ===== -->\n        <div id=\"sec-s2\" style=\"scroll-margin-top:96px;margin-top:54px;border-top:1px solid #E1DFDD;padding-top:30px;\">\n          <div style=\"font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#2B5797;font-weight:700;\">Document 2<\u002Fdiv>\n          <h2 style=\"font-size:25px;color:#1B1B1B;margin:4px 0 14px;\">Project Plan &amp; Schedule<\u002Fh2>\n          <p>Thirteen work packages across six months. The plan is baselined; % complete is rolled up from the task tracker (§12) each Friday.<\u002Fp>\n          <table class=\"wtable\">\n            <thead><tr><th style=\"width:40px;\">#<\u002Fth><th>Task<\u002Fth><th style=\"width:80px;\">Owner<\u002Fth><th style=\"width:62px;\">Start<\u002Fth><th style=\"width:62px;\">Finish<\u002Fth><th style=\"width:54px;\">%<\u002Fth><th style=\"width:96px;\">Status<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td>1<\u002Ftd><td>Discovery &amp; requirements<\u002Ftd><td>Priya<\u002Ftd><td>06 Jan<\u002Ftd><td>24 Jan<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>2<\u002Ftd><td>Vendor contract &amp; licensing<\u002Ftd><td>Daniel<\u002Ftd><td>13 Jan<\u002Ftd><td>31 Jan<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>3<\u002Ftd><td>Solution design / blueprint<\u002Ftd><td>Priya<\u002Ftd><td>03 Feb<\u002Ftd><td>21 Feb<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>4<\u002Ftd><td>Data mapping &amp; cleansing<\u002Ftd><td>Marcus<\u002Ftd><td>10 Feb<\u002Ftd><td>14 Mar<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>5<\u002Ftd><td>Environment build &amp; config<\u002Ftd><td>Priya<\u002Ftd><td>24 Feb<\u002Ftd><td>13 Mar<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>6<\u002Ftd><td>Integrations (ERP, email, phone)<\u002Ftd><td>Priya<\u002Ftd><td>16 Mar<\u002Ftd><td>10 Apr<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>7<\u002Ftd><td>Migration dry runs (×2)<\u002Ftd><td>Marcus<\u002Ftd><td>30 Mar<\u002Ftd><td>03 Apr<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>8<\u002Ftd><td>UAT cycle 1<\u002Ftd><td>Sara<\u002Ftd><td>13 Apr<\u002Ftd><td>24 Apr<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>9<\u002Ftd><td>Training &amp; enablement<\u002Ftd><td>Lena<\u002Ftd><td>20 Apr<\u002Ftd><td>15 May<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>10<\u002Ftd><td>UAT cycle 2 / sign-off<\u002Ftd><td>Sara<\u002Ftd><td>04 May<\u002Ftd><td>08 May<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>11<\u002Ftd><td>◆ Cutover &amp; go-live<\u002Ftd><td>Jewel<\u002Ftd><td>15 May<\u002Ftd><td>18 May<\u002Ftd><td>100%<\u002Ftd><td style=\"color:#107C10;font-weight:600;\">Complete<\u002Ftd><\u002Ftr>\n              <tr><td>12<\u002Ftd><td>Hypercare &amp; stabilization<\u002Ftd><td>Jewel<\u002Ftd><td>19 May<\u002Ftd><td>30 Jun<\u002Ftd><td>65%<\u002Ftd><td style=\"color:#CA5010;font-weight:600;\">In progress<\u002Ftd><\u002Ftr>\n              <tr><td>13<\u002Ftd><td>Phase 1 close &amp; lessons<\u002Ftd><td>Jewel<\u002Ftd><td>01 Jul<\u002Ftd><td>11 Jul<\u002Ftd><td>0%<\u002Ftd><td x dotted #2B5797;color:#2B5797;font-weight:600;\">Jewel<\u002Fspan> (approves) · <span data-tip=\"own_daniel\" style=\"cursor:help;border-bottom:1px dotted #2B5797;color:#2B5797;font-weight:600;\">Daniel<\u002Fspan> (funds)<\u002Fspan>\n              <span style=\"color:#605E5C;\">How / cadence<\u002Fspan><span>Expenses submitted weekly in Concur; childcare needs a manager note; milestone bonuses paid on the go-live and close payroll cycles<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:48px;border-top:1px solid #E1DFDD;padding-top:16px;text-align:center;font-size:11.5px;color:#8A8886;\">\n          NexGen CRM Rollout — Project Playbook · Brightpath Logistics · Confidential · v3.2 · 24 Jun 2026\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  state = { query: '', active: 'cover' };\n  go(id) {\n    this.setState({ active: id });\n    const doScroll = () => {\n      const el = document.getElementById('sec-' + id);\n      if (!el) return;\n      const cur = window.pageYOffset || document.documentElement.scrollTop || 0;\n      const top = el.getBoundingClientRect().top + cur - 88;\n      window.scrollTo(0, top);\n      document.documentElement.scrollTop = top;\n      document.body.scrollTop = top;\n    };\n    doScroll();\n    setTimeout(doScroll, 60);\n  }\n  componentDidMount() {\n    this._onScroll = () => {\n      const ids = this.sectionIds || [];\n      let cur = ids[0];\n      for (const id of ids) {\n        const el = document.getElementById('sec-' + id);\n        if (el && el.getBoundingClientRect().top <= 140) cur = id;\n      }\n      if (cur !== this.state.active) this.setState({ active: cur });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    // ---- hover tooltip engine ----\n    const tip = document.createElement('div');\n    tip.style.cssText = 'position:fixed;z-index:9999;max-width:272px;background:#1B2B4A;color:#fff;padding:11px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.34);font-size:12px;line-height:1.45;pointer-events:none;display:none;font-family:Segoe UI,system-ui,sans-serif;border:1px solid #33476E;';\n    document.body.appendChild(tip);\n    this._tip = tip;\n    this._position = (e) => {\n      const pad = 15, w = tip.offsetWidth, h = tip.offsetHeight;\n      let x = e.clientX + pad, y = e.clientY + pad;\n      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;\n      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;\n      tip.style.left = Math.max(8, x) + 'px';\n      tip.style.top = Math.max(8, y) + 'px';\n    };\n    this._over = (e) => {\n      const t = e.target.closest && e.target.closest('[data-tip]');\n      if (!t) return;\n      const html = this.buildTipHTML(t.getAttribute('data-tip'));\n      if (!html) return;\n      tip.innerHTML = html; tip.style.display = 'block'; this._position(e);\n    };\n    this._out = (e) => {\n      const t = e.target.closest && e.target.closest('[data-tip]');\n      if (!t) return;\n      const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-tip]') : null;\n      if (to !== t) tip.style.display = 'none';\n    };\n    this._move = (e) => { if (tip.style.display === 'block') this._position(e); };\n    document.addEventListener('mouseover', this._over);\n    document.addEventListener('mouseout', this._out);\n    document.addEventListener('mousemove', this._move);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    document.removeEventListener('mouseover', this._over);\n    document.removeEventListener('mouseout', this._out);\n    document.removeEventListener('mousemove', this._move);\n    if (this._tip && this._tip.parentNode) this._tip.parentNode.removeChild(this._tip);\n  }\n  buildTipHTML(key) {\n    const TIPS = {\n      rag_overall: { title: 'Overall status — On Track', deriv: 'Composite RAG across schedule, cost, scope & risk. 3 of 4 dimensions green; adoption amber.', trend: [{ m: 'W18', v: 2 }, { m: 'W19', v: 2 }, { m: 'W20', v: 3 }, { m: 'W21', v: 3 }, { m: 'W22', v: 3, hl: true }], tool: 'NexGen dashboards + PM roll-up', reco: 'Hold weekly cadence until adoption ≥ 80%, then move to monthly.' },\n      m_adopt: { title: '30-day active users — 82%', deriv: '196 of 240 licensed users active in the last 30 days (196 ÷ 240 = 82%).', trend: [{ m: 'W1', v: 34 }, { m: 'W2', v: 51 }, { m: 'W3', v: 63 }, { m: 'W4', v: 72 }, { m: 'W5', v: 78 }, { m: 'W6', v: 82, hl: true }], tool: 'NexGen CRM › Adoption dashboard', reco: 'Coach the Support team (71%) to clear the 80% gate.' },\n      m_issues: { title: 'Open issues — 14', deriv: '47 logged − 33 resolved = 14 open (2 High priority).', trend: [{ m: 'W1', v: 31 }, { m: 'W2', v: 24 }, { m: 'W3', v: 19 }, { m: 'W4', v: 16 }, { m: 'W5', v: 14, hl: true }], tool: 'Microsoft Teams › Planner board', reco: 'Burning down ~3/week; on track to clear by Phase-1 close.' },\n      m_budget: { title: 'Budget spent — 96%', deriv: '$459.5K actual ÷ $480K approved = 95.7%. Tracking 4% under.', trend: [{ m: 'Feb', v: 18 }, { m: 'Mar', v: 41 }, { m: 'Apr', v: 67 }, { m: 'May', v: 88 }, { m: 'Jun', v: 96, hl: true }], tool: 'Excel › Budget tab (linked to Finance actuals)', reco: 'Hold $12K contingency until hypercare CR-10 is decided.' },\n      st_accomp: { title: 'Accomplishments — Green', tool: 'Verified in NexGen migration logs + EMEA cutover checklist.', reco: 'Capture the EMEA approach as the template for Phase-2 regions.' },\n      st_progress: { title: 'In progress — Green', tool: 'Tracked in Teams Planner (hypercare) + LMS completion data.', reco: 'Front-load manager report-builder training before close.' },\n      st_adopt: { title: 'Adoption — Amber', tool: 'Measured via the NexGen adoption report, by team.', reco: '1:1 coaching plus a usage leaderboard for the Support team.' },\n      st_next: { title: 'Next period — Green', tool: 'Planned in the Excel schedule (§2), tasks 12–13.', reco: 'Run lessons-learned while hypercare context is still fresh.' },\n      bud_total: { title: 'Total variance — $20.5K under', deriv: '$480.0K planned − $459.5K actual = $20.5K (4.3%) under budget.', tool: 'Excel › Budget tab', reco: 'Reallocate surplus to extended hypercare (CR-10) or return it.' },\n      bud_partner: { title: 'Partner line — 105%', deriv: '$152.4K actual vs $145.0K planned = $7.4K over (CR-07, +2 wks integration).', tool: 'Excel › Budget tab + Change Log CR-07', reco: 'Move hypercare to a fixed-fee SOW to cap further overrun.' },\n      inc_trip: { title: 'Per-trip cost — $1,685', deriv: 'Flight $480 + hotel $660 + ground $140 + meals $225 + childcare $180.', tool: 'Concur travel + Excel › Travel & Incentives tab', reco: 'Book flights 14+ days out to hold the $480 fare cap.' },\n      inc_month: { title: 'Monthly travel — $16,850', deriv: '5 core travelers × $1,685 per trip × 2 trips/month.', tool: 'Excel › Travel & Incentives tab', reco: 'Co-locate both trips around steering & UAT to cut a 3rd trip.' },\n      inc_perks: { title: 'Monthly perks — $2,840', deriv: '8 team members × $355 (phone $85 + home office $120 + meals $100 + wellness $50).', tool: 'Excel › Travel & Incentives tab', reco: 'Keep perks running through hypercare to protect retention.' },\n      inc_oneoff: { title: 'One-time incentives — $19,000', deriv: 'Go-live bonus $12,000 + spot pool $3,000 + Cali dinner $2,400 + close party $1,600.', tool: 'Excel › Travel & Incentives tab', reco: 'Pay go-live bonus on the same cycle as the close milestone.' },\n      r1: { title: 'R1 · Mitigated', deriv: 'Two full migration dry runs completed; every load passed a 99% validation gate. Residual duplicates cleared by automated merge rules.', tool: 'Excel Risk tab · evidence in migration logs' },\n      r2: { title: 'R2 · Open', deriv: 'Support adoption still under target. Champions network is live and role-based refreshers are booked.', reco: 'Closes when 30-day active users ≥ 80% for Support.' },\n      r3: { title: 'R3 · Mitigated', deriv: 'Async queue with exponential-backoff retry deployed and load-tested at 2× peak; latency now within SLA.', tool: 'NexGen integration monitoring' },\n      r4: { title: 'R4 · Open', deriv: 'Month-end SME availability still tight. Backfill cover arranged and change freezes set around close.', reco: 'Stays open through hypercare; review at Phase-1 close.' },\n      r5: { title: 'R5 · Monitoring', deriv: 'Custom-reporting requests routed to the Change Control Board; extra scope parked in the Phase-2 backlog.', reco: 'Watching for new requests; escalate if volume rises.' },\n      r6: { title: 'R6 · Closed', deriv: 'Telephony vendor moved to a versioned endpoint with an SLA. No residual exposure — no further action needed.' },\n      r7: { title: 'R7 · Monitoring', deriv: 'Partner hours being converted to a fixed-fee SOW for hypercare to cap spend.', reco: 'Watching weekly burn vs the cap (see CR-10).' },\n      i118: { title: 'I-118 · In progress', deriv: 'EMEA merge created duplicate accounts. Merge rules being tuned; dedupe script re-runs nightly.', reco: 'ETA 2 days (High priority).' },\n      i121: { title: 'I-121 · In progress', deriv: 'Quote PDF missing a tax line. Field-mapping fix is in QA.', reco: 'Patch to production this week.' },\n      i124: { title: 'I-124 · Investigating', deriv: 'Email sync delay traced to mailbox throttling; testing a batch-interval change.', reco: 'Confirm fix in staging before prod.' },\n      i126: { title: 'I-126 · In progress', deriv: 'Support queue routing rule corrected in config; validating in UAT.', reco: 'Promote to prod after sign-off.' },\n      i129: { title: 'I-129 · Backlog', deriv: 'Dashboard tile won’t persist a saved filter — cosmetic, low priority.', reco: 'Scheduled after hypercare.' },\n      i131: { title: 'I-131 · Investigating', deriv: 'Mobile account-list slow; query profiled and an index candidate identified.', reco: 'Test the index in staging.' },\n      i133: { title: 'I-133 · Resolved', deriv: 'Broken LMS training-video link repointed and verified live.' },\n      cr03: { title: 'CR-03 · Approved', deriv: 'Telephony integration added — clear value for call logging. +5 days absorbed in schedule float.' },\n      cr05: { title: 'CR-05 · Approved', deriv: 'Second dry run approved after run 1 surfaced edge cases. Risk reduction judged worth +3 days.' },\n      cr07: { title: 'CR-07 · Approved', deriv: 'Extra partner integration hours — ERP complexity higher than scoped. +$7.4K drawn from contingency.' },\n      cr08: { title: 'CR-08 · Approved', deriv: 'Marketing automation deferred to Phase 2 to protect the go-live date. No cost impact.' },\n      cr09: { title: 'CR-09 · Rejected', deriv: 'Two extra exec dashboards declined — out of Phase-1 scope. Added to the Phase-2 backlog to protect the timeline.' },\n      cr10: { title: 'CR-10 · Pending', deriv: 'Extend hypercare 6→8 weeks (+$9K). Awaiting steering decision (Jun 27); hinges on issue burn-down.' },\n      golive: { title: 'Go-live decision — Approved 15 May', deriv: 'Go/no-go gate: UAT cycle 2 signed off, 99.2% data accuracy, rollback plan ready. Daniel (A) approved; cutover ran 15–18 May.', tool: 'Logged in SharePoint + steering minutes' },\n      own_jewel: { contact: true, name: 'Jewel Smith', role: 'Project Manager', email: 'jewel.smith@brightpath.io', phone: '+1 (757) 555-0148', note: 'First contact for status, schedule & escalations.' },\n      own_daniel: { contact: true, name: 'Daniel', role: 'Sponsor · VP Revenue Operations', email: 'daniel.okafor@brightpath.io', phone: '+1 (757) 555-0102', note: 'Budget holder & steering-committee chair.' },\n      own_priya: { contact: true, name: 'Priya', role: 'Implementation Lead', email: 'priya.raman@brightpath.io', phone: '+1 (757) 555-0173', note: 'Owns build, integrations & hypercare issues.' },\n      own_marcus: { contact: true, name: 'Marcus', role: 'Data & Migration', email: 'marcus.lee@brightpath.io', phone: '+1 (757) 555-0191', note: 'Owns data quality, mapping & migration runs.' },\n      own_sara: { contact: true, name: 'Sara', role: 'Change & Adoption', email: 'sara.kim@brightpath.io', phone: '+1 (757) 555-0166', note: 'Owns UAT sign-off & adoption metrics.' },\n      own_lena: { contact: true, name: 'Lena', role: 'Comms & Training', email: 'lena.ortiz@brightpath.io', phone: '+1 (757) 555-0120', note: 'Owns comms, training & incentives logistics.' },\n    };\n    const t = TIPS[key];\n    if (!t) return '';\n    if (t.contact) {\n      return '<div style=\"font-weight:700;font-size:13px;\">' + t.name + '<\u002Fdiv>' +\n        '<div style=\"color:#9FB4D6;font-size:11px;margin-bottom:7px;\">' + t.role + '<\u002Fdiv>' +\n        '<div style=\"font-size:11.5px;line-height:1.7;\">' +\n        '<div>✉ ' + t.email + '<\u002Fdiv>' +\n        (t.phone ? '<div>☎ ' + t.phone + '<\u002Fdiv>' : '') +\n        (t.note ? '<div style=\"margin-top:6px;color:#9FB4D6;\">' + t.note + '<\u002Fdiv>' : '') + '<\u002Fdiv>';\n    }\n    let spark = '';\n    if (t.trend) {\n      const max = Math.max.apply(null, t.trend.map(p => p.v));\n      spark = '<div style=\"display:flex;align-items:flex-end;gap:5px;height:46px;margin:9px 0 2px;\">' +\n        t.trend.map(p => '<div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;\">' +\n          '<div style=\"width:15px;height:' + (Math.round(p.v / max * 34) + 3) + 'px;background:' + (p.hl ? '#41E3A0' : '#5B82C0') + ';border-radius:2px;\"><\u002Fdiv>' +\n          '<div style=\"font-size:8px;color:#8497B8;\">' + p.m + '<\u002Fdiv><\u002Fdiv>').join('') + '<\u002Fdiv>';\n    }\n    return '<div style=\"font-weight:700;font-size:12.5px;margin-bottom:4px;\">' + t.title + '<\u002Fdiv>' +\n      (t.deriv ? '<div style=\"font-size:11.5px;color:#DCE6F5;\">' + t.deriv + '<\u002Fdiv>' : '') +\n      spark +\n      (t.tool ? '<div style=\"font-size:11px;color:#8FB7F5;margin-top:7px;border-top:1px solid rgba(255,255,255,.16);padding-top:6px;\">⚙ ' + t.tool + '<\u002Fdiv>' : '') +\n      (t.reco ? '<div style=\"font-size:11px;color:#FFD49A;margin-top:5px;\">➜ ' + t.reco + '<\u002Fdiv>' : '');\n  }\n\n  renderVals() {\n    const sections = [\n      { id: 'cover', num: '', title: 'Cover & document control', h: true },\n      { id: 'toc', num: '', title: 'How to use this playbook', h: true },\n      { id: 's1', num: '1', title: 'Project Charter' },\n      { id: 's2', num: '2', title: 'Project Plan & Schedule' },\n      { id: 's3', num: '3', title: 'Gantt / Timeline' },\n      { id: 's4', num: '4', title: 'Status Report' },\n      { id: 's5', num: '5', title: 'Risk Register' },\n      { id: 's6', num: '6', title: 'Issue Tracker' },\n      { id: 's7', num: '7', title: 'Budget Tracker' },\n      { id: 's8', num: '8', title: 'Resource Plan' },\n      { id: 's9', num: '9', title: 'Communication Plan' },\n      { id: 's10', num: '10', title: 'Change Log' },\n      { id: 's11', num: '11', title: 'Work Breakdown Structure' },\n      { id: 's12', num: '12', title: 'RACI Matrix & Task Tracker' },\n      { id: 's13', num: '13', title: 'Team Incentives & Logistics' },\n    ];\n    this.sectionIds = sections.map(s => s.id);\n\n    // Gantt: months Jan(0)..Jul(6); position = month fraction across 6-month span\n    const span = 6;\n    const bar = (s, e, color) => ({ left: (s / span * 100) + '%', width: ((e - s) / span * 100) + '%', color });\n    const gantt = [\n      Object.assign({ task: 'Discovery & requirements' }, bar(0.15, 0.75, '#5B7DB1')),\n      Object.assign({ task: 'Contract & licensing' }, bar(0.4, 0.95, '#5B7DB1')),\n      Object.assign({ task: 'Solution design' }, bar(1.05, 1.65, '#5B7DB1')),\n      Object.assign({ task: 'Data mapping & cleanse' }, bar(1.3, 2.4, '#5B7DB1')),\n      Object.assign({ task: 'Environment build' }, bar(1.8, 2.4, '#5B7DB1')),\n      Object.assign({ task: 'Integrations' }, bar(2.5, 3.3, '#5B7DB1')),\n      Object.assign({ task: 'Migration dry runs' }, bar(2.95, 3.1, '#5B7DB1')),\n      Object.assign({ task: 'UAT cycles' }, bar(3.4, 4.25, '#5B7DB1')),\n      Object.assign({ task: 'Training & enablement' }, bar(3.65, 4.5, '#2B5797')),\n      Object.assign({ task: '◆ Cutover & go-live' }, bar(4.5, 4.62, '#107C10')),\n      Object.assign({ task: 'Hypercare' }, bar(4.65, 5.95, '#CA5010')),\n    ];\n    const q = this.state.query.trim().toLowerCase();\n    const active = this.state.active;\n    const navItems = sections\n      .filter(s => !q || s.title.toLowerCase().includes(q))\n      .map(s => {\n        const on = s.id === active;\n        return {\n          num: s.num, title: s.title, go: () => this.go(s.id),\n          bg: on ? '#E1EAF8' : 'transparent',\n          bar: on ? '#2B5797' : 'transparent',\n          numColor: s.h ? '#8A8886' : '#2B5797',\n          textColor: s.h ? '#605E5C' : '#242424',\n          weight: s.h ? '600' : (on ? '700' : '400'),\n        };\n      });\n    return {\n      gantt,\n      navItems,\n      query: this.state.query,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
